[project]
name = "noto-ridif"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepthought", email = "deepthought@postech.ac.kr" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "cu2qu>=1.6.7.post2",
    "fonttools>=4.68.0",
    "freetype-py>=2.5.1",
    "pillow>=13.0.0",
]

[project.scripts]
noto-ridif = "noto_ridif:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "brotli>=1.2.1",
    "pytest>=9.2.0",
    "pytest-ruff>=0.5",
    "ttfautohint-py>=0.6.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ruff"
