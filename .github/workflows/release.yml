name: Build and Release Font

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen || uv sync

      - name: Build merged and hinted font
        run: uv run noto-ridif --hint --verify --output noto-ridif.ttf

      - name: Build E-Paper fonts (20px and 28px, 2-bit)
        run: |
          uv run python scripts/font_to_epdfont.py noto-ridif 20 noto-ridif.ttf -o noto-ridif_20_2bit.epdfont
          uv run python scripts/font_to_epdfont.py noto-ridif 28 noto-ridif.ttf -o noto-ridif_28_2bit.epdfont

      - name: Build web fonts (WOFF and WOFF2)
        run: uv run python scripts/font_to_woff.py noto-ridif.ttf --output-dir .

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            noto-ridif.ttf
            noto-ridif.woff
            noto-ridif.woff2
            noto-ridif_20_2bit.epdfont
            noto-ridif_28_2bit.epdfont
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifact (on workflow_dispatch or tag)
        uses: actions/upload-artifact@v4
        with:
          name: noto-ridif-font
          path: |
            noto-ridif.ttf
            noto-ridif.woff
            noto-ridif.woff2
            noto-ridif_20_2bit.epdfont
            noto-ridif_28_2bit.epdfont
